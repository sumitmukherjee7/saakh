rs_pmegp_negative_list_2024:
  title: "Rajya Sabha Unstarred Question 1542 (5 Aug 2024), PMEGP: activities not permitted, relaxations and the COVID-year exemption"
  publisher: Rajya Sabha (Ministry of MSME reply)
  url: https://rsdebate.nic.in/bitstream/123456789/750459/1/PQ_265_05082024_U1542_p345_p346.pdf
  verification: verified
  checked: 2026-11-10
  note: Read in full (official reply, pp. 345-346). Lists activities not permitted (meat, intoxicants, liquor-serving outlets, tobacco, toddy; locally prohibited activities; polythene carry bags under 75 microns and recycled-plastic food packaging; cultivation, plantation, horticulture, floriculture, animal husbandry) with exceptions (non-veg food at hotels/dhabas; value addition; farm-linked sericulture, horticulture, floriculture); relaxations for dairy, poultry, aquaculture and sericulture; COVID years FY 2020-21 and 2021-22 exempted from the 2nd-loan profitability test.


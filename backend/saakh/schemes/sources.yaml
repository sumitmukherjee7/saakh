# Source registry. Every eligibility criterion and every benefit in the scheme
# knowledge base cites one of these sources by id plus a locator.
#
# verification:
#   verified            – clause text was read on the official page on `checked`.
#   official_unverified – official document identified; clause taken from
#                         secondary summaries and awaiting maintainer check.
#   secondary           – only non-official sources; the agent always tells the
#                         user to confirm with the branch / agency.
#
# checked = date the source was last opened by the maintainers (YYYY-MM-DD).

